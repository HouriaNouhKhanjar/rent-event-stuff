{% extends "base.html" %}

{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'supplies/css/supplies.css' %}">
{% endblock %}

{% block extra_title %} | Add Supply {% endblock %}

{% block page_header %}
<div class="container-fluid header-container">
    <div class="row">
        <div class="col"></div>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-md-5 py-3">
    <div class="row mt-5">
        <div class="col">
            <h1><strong> Supply Management </strong></h1>
            <h2 class="text-muted display-6">Add a Product</h2>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-md-6 px-0 px-md-2 py-3">
            <form method="POST" action="{% url 'add_supply' %}" class="form mb-2" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form | crispy }}
                <div class="text-right">
                    <a class="btn action-button-secondary" href="{% url 'supplies' %}">Cancel</a>
                    <button class="btn action-button" type="submit">Add Supply</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
