<div class="row my-3 pb-5">
    <div class="col-12 col-lg-8 offset-lg-2">
        <h3>Reviews:</h3>
        <hr class="text-muted">
        </hr>
    </div>
    {% if user.is_authenticated %}
    <div class="col-12 col-md-6 col-lg-4 offset-lg-2">
        rewiews
    </div>
    <div class="col-12 col-md-6 col-lg-4">
        {% if can_make_review %}
        <div>
            <form method="post" action="{% url 'review_supply' supply.id %}">
                {% csrf_token %}
                {{ review_form.rating | as_crispy_field }}
                {{ review_form.comment | as_crispy_field }}
                <button type="submit" class="btn action-button">Submit Review</button>
            </form>
        </div>
        {% endif %}
    </div>
    {% else %}
    <div class="col-12">
        <span class="col-12">
            <a class="link text-info" href="{{ login_url }}">Sign in</a>
            in to show the reviews.
        </span>.
        <p class="card-text placeholder-glow">
            <span class="placeholder col-12 col-md-8 col-lg-3"></span>
            <span class="placeholder col-0 col-lg-2"></span>
        </p>
        <p class="card-text placeholder-glow">
            <span class="placeholder col-12 col-md-8 col-lg-3"></span>
            <span class="placeholder col-0 col-lg-2"></span>
        </p>
        <p class="card-text placeholder-glow">
            <span class="placeholder col-12 col-md-8 col-lg-3"></span>
            <span class="placeholder col-0 col-lg-2"></span>
        </p>
        <p class="my-2">
            <textarea class="placeholder col-12 col-md-8 col-lg-5"></textarea>
        </p>
        <p>
            <a class="btn btn-primary disabled placeholder col-12 col-md-3 col-lg-1" aria-disabled="true"></a>
        </p>
    </div>
    {% endif %}
</div>
